name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEMPL_VERSION: v0.3.1001
  TAILWIND_VERSION: v4.2.4

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Generate templ files
        run: templ generate

      - name: Install Tailwind CSS CLI
        run: |
          curl -fsSL https://github.com/tailwindlabs/tailwindcss/releases/download/${{ env.TAILWIND_VERSION }}/tailwindcss-linux-x64 \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss

      - name: Build CSS
        run: tailwindcss -i web/static/css/input.css -o web/static/css/style.css --minify

      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=darwin  GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/conductor-darwin-amd64  ./cmd/conductor
          GOOS=darwin  GOARCH=arm64        CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/conductor-darwin-arm64  ./cmd/conductor
          GOOS=linux   GOARCH=amd64        CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/conductor-linux-amd64   ./cmd/conductor
          GOOS=linux   GOARCH=arm64        CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/conductor-linux-arm64   ./cmd/conductor
          GOOS=linux   GOARCH=arm  GOARM=7 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/conductor-linux-armhf   ./cmd/conductor

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Generate templ files
        run: templ generate

      - name: Install Tailwind CSS CLI
        run: |
          curl -fsSL https://github.com/tailwindlabs/tailwindcss/releases/download/${{ env.TAILWIND_VERSION }}/tailwindcss-linux-x64 \
            -o /usr/local/bin/tailwindcss
          chmod +x /usr/local/bin/tailwindcss

      - name: Build CSS
        run: tailwindcss -i web/static/css/input.css -o web/static/css/style.css --minify

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
